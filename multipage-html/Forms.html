<body>

<h1>Please Fill In The Form Below</h1>
<br>
<h3>Insert Local Time</h3>
<label for="time">Date and Time:</label><br>
<input type="datetime-local" id="time" name="inputtime"><br>


<form>
<h3>Insert Name</h3>
    <label for="fname">First Name:</label>
<br>
    <input type="text" id="fname"
name="fname"><br>
    <label for="mname">Middle Name (Optional)</label>
<br>
    <input type="text" id="mname"
name="mname"><br>
    <label for="lname">Last Name:</label>
<br>
    <input type="text" id="lname"
name="lname"><br><br>
<input type="reset" value="Reset">


<br><h3>Binus Location</h3>
<input type="radio" id="kemanggisan" name="loc_Binus" value="Kemanggisan">
<label for="kemanggisan">Kemanggisan</label><br>
<input type="radio" id="Alsut" name="loc_Binus" value="Alam Sutera">
<label for="Alsut">Alam Sutera</label><br>
<input type="radio" id="Binter" name="loc_Binus" value="Binus Senayan">
<label for="Binter">Senayan</label><br>
<input type="radio" id="malang" name="loc_Binus" value="Malang">
<label for="malang">Malang</label><br>
<input type="radio" id="Bekasi" name="loc_Binus" value="Bekasi">
<label for="Bekasi">Bekasi</label><br>
<input type="radio" id="Bandung" name="loc_Binus" value="Bandung">
<label for="Bandung">Bandung</label><br>
<input type="radio" id="Aso" name="loc_Binus" value="Binus Aso">
<label for="Aso">Aso</label><br>
<input type="radio" id="Semarang" name="loc_Binus" value="Semarang">
<label for="Semarang">Semarang</label>

<br><h3>Which Page Have u Read?</h3>
<input type="checkbox" id="jkt" name="pglook" value="jkt">
<label for="jkt">Jakarta</label><br>
<input type="checkbox" id="gbk" name="pglook" value="gbk">
<label for="gbk">Gelora Bung Karno(GBK)</label><br>
<input type="checkbox" id="monas" name="pglook" value="monas">
<label for="monas">Monumen Nasional(Monas)</label><br>


<br>
<input type="submit" value="Submit">
<input type="reset" value="Reset Form">

</form>
